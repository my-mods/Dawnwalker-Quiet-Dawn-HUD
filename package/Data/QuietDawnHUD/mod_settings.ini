[Mod]
Id = oOCamilleOo_QuietDawnHUD
Name = Quiet Dawn - Customizable HUD
Author = oOCamilleOo
Version = 0.0.0
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Enabled
Group = General
Description = Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.hideEnemyNames]
Id = hideEnemyNames
Label = Hide enemy names
Group = Enemies
Description = Hide enemy name labels, including boss names. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hideEnemyNames

[Setting.hideEnemyDifficultyIcons]
Id = hideEnemyDifficultyIcons
Label = Hide enemy difficulty icons
Group = Enemies
Description = Hide enemy and boss difficulty indicators. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hideEnemyDifficultyIcons

[Setting.healthThreshold]
Id = healthThreshold
Label = Keep health visible below
Group = Vitals
Description = Keep the health/stamina display visible while human health or vampire blood is below this percentage. Default: 50%. 0% disables the low-health trigger; damage and stamina alerts still work. Adjusts in 5 percentage-point steps. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 50
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = healthThreshold
Suffix = %

[Setting.staminaThreshold]
Id = staminaThreshold
Label = Keep stamina visible below
Group = Vitals
Description = Keep the health/stamina display visible while stamina is below this percentage. Default: 20%. At 0%, stamina use can still reveal it for the stamina hold duration. Adjusts in 5 percentage-point steps. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 20
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaThreshold
Suffix = %

[Setting.healthHoldSeconds]
Id = healthHoldSeconds
Label = Health / blood hold duration
Group = Vitals
Description = How long health and stamina stay visible after health or blood loss. Low health remains visible. Adjusts in 0.5-second steps. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 60
Step = 0.5
Decimals = 2
Default = 4
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = healthHoldSeconds
Suffix = s

[Setting.staminaHoldSeconds]
Id = staminaHoldSeconds
Label = Stamina hold duration
Group = Vitals
Description = How long health and stamina stay visible after stamina use. Low stamina remains visible. Adjusts in 0.5-second steps. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 60
Step = 0.5
Decimals = 2
Default = 1.5
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaHoldSeconds
Suffix = s

[Setting.manualPeekSeconds]
Id = manualPeekSeconds
Label = Show HUD duration
Group = Vitals
Description = How long the HUD stays visible after the hold action activates; this is not how long you hold the button. Adjusts in 0.5-second steps. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 60
Step = 0.5
Decimals = 2
Default = 3
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = manualPeekSeconds
VisibleWhen = manualPeek
VisibleValues = 1
Suffix = s

[Setting.manualPeek]
Id = manualPeek
Label = Show HUD on hold
Group = Vitals
Description = Uses the game's Toggle Controls Legend action. Hold Menu (Xbox), Options (PlayStation), or L (keyboard) by default. Follows remaps: Toggle Controls Legend in Controller Tweaks and Remap, or the game's keyboard bindings. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = manualPeek

[Setting.opacity_WBP_HudTimer]
Id = opacity_WBP_HudTimer
Label = Time of day opacity
Group = HUD visibility
Description = 0% = hidden until time advances or HUD peek. Values above 0% keep the panel shown at the selected opacity. Adjusts in 5 percentage-point steps. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = opacity_WBP_HudTimer
Suffix = %

[Setting.timeHoldSeconds]
Id = timeHoldSeconds
Label = Time of day reveal duration
Group = HUD visibility
Description = At 0% opacity, show the time panel at 100% for this many seconds after the last time change. Default: 4 seconds. 0 seconds disables automatic time-change reveals. HUD peek still works. Apply, then load a save.
Type = slider
Minimum = 0
Maximum = 60
Step = 0.5
Decimals = 1
Default = 4
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = timeHoldSeconds
Suffix = s

[Setting.compassOpacity]
Id = compassOpacity
Label = Compass opacity
Group = HUD visibility
Description = 0% = managed by Quiet Dawn (hidden between HUD peeks); values above 0% keep the compass shown at the selected opacity; 100% = fully opaque. HUD peek temporarily shows it at 100%. Adjusts in 5 percentage-point steps. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = compassOpacity
Suffix = %

